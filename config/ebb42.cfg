# ==========================================================================
# ebb42.cfg  --  BTT EBB42 Gen2 (STM32G0B1) toolhead, over CAN
# --------------------------------------------------------------------------
# Pins are the OFFICIAL EBB42 Gen2 silkscreen (from BTT's
# sample-bigtreetech-ebb42-gen2-v1.0.cfg), NOT the older EBB42 layout.
#
# Flashing / CAN bring-up:
#   1. USB/CAN jumper -> USB. Flash Katapult + Klipper over USB.
#   2. Move the jumper -> CAN. Set the CAN 120R jumper (one of the two
#      terminators; the EBB USB adapter / U2C is the other).
#   3. Find the UUID:  ~/klipper/scripts/canbus_query.py can0
#      (or  ~/katapult/scripts/flashtool.py -q )
#   4. Comment serial:, set canbus_uuid below.
# Host CAN bridge = the BTT EBB USB adapter (U2C). Bring up can0 at 1M
# (matching the firmware CAN speed) before starting Klipper.
# ==========================================================================

[mcu EBB]
#serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_XXXXXXXXXXXX-if00   # USB (flash / first bring-up)
canbus_uuid: 0000000000000000   # <-- set after CAN flash (see header)
restart_method: command

[temperature_sensor EBB42_chip]
sensor_type: temperature_mcu
sensor_mcu: EBB
min_temp: 0
max_temp: 100

# --------------------------------------------------------------------------
# Toolhead accelerometer (onboard LIS2DW12), software SPI.
# Input shaping for X. The stock bed-mounted Y accelerometer is dropped with
# the RS232 leveling MCU, so for Y shaping temporarily mount this toolhead
# accel on the bed during SHAPER_CALIBRATE AXIS=Y.
# --------------------------------------------------------------------------
[lis2dw]
cs_pin: EBB:PB1
spi_software_sclk_pin: EBB:PB10
spi_software_mosi_pin: EBB:PB11
spi_software_miso_pin: EBB:PB2
axes_map: x, y, z

[resonance_tester]
accel_chip: lis2dw
probe_points:
    130, 130, 20

# --------------------------------------------------------------------------
# Fans
#   FAN0 (PB8)  = part cooling (24V blower)
#   FAN2 (PB4)  = hotend heat-break fan (3-pin Noctua), tach on PB9 (DET)
#   FAN1 (PB15) = EBB42 board cooling fan (2-pin Noctua)
# --------------------------------------------------------------------------
[fan]
pin: EBB:PB8
kick_start_time: 0.25

[heater_fan hotend_fan]
pin: EBB:PB4
tachometer_pin: EBB:PB9
heater: extruder
heater_temp: 50.0
max_power: 1.0

# Board fan runs whenever any stepper is enabled (electronics cooling).
[controller_fan ebb_board_fan]
pin: EBB:PB15
fan_speed: 1.0
idle_timeout: 60

# --------------------------------------------------------------------------
# Nebula filament runout switch  --  FIL header (PA3).
# One physical switch. (The stock "2-pin FIL" and the 5-pin harness green
# wire are the same net; wire it once here.)
# --------------------------------------------------------------------------
[filament_switch_sensor nebula_filament_sensor]
switch_pin: ^EBB:PA3
pause_on_runout: True
runout_gcode:
    PAUSE
    RESPOND MSG="Filament runout at toolhead"
insert_gcode:
    RESPOND MSG="Filament detected at toolhead"

# --------------------------------------------------------------------------
# Nebula macro button  --  PROBE header, SERVOS position (PA4).
# Bind it to whatever action you like (load, unload, etc.).
# --------------------------------------------------------------------------
[gcode_button nebula_button]
pin: ^EBB:PA4
press_gcode:
    RESPOND MSG="Nebula button pressed"
release_gcode:

# --------------------------------------------------------------------------
# Cutter hall sensor  --  PROBE header, PROBE position (PA5).
# Read by the CUT_FILAMENT macro (macros.cfg) for the stock two-check:
# RELEASED = normal, PRESSED = pressed against the stopper.
# VALIDATE polarity with QUERY_BUTTON BUTTON=cutter_hall and flip ^ / ^! if reversed.
# 5V->3.3V step-down on VCC; the SIGNAL must swing 0-3.3V (PA5 is NOT 5V-tolerant).
# --------------------------------------------------------------------------
[gcode_button cutter_hall]
pin: ^EBB:PA5
press_gcode:
release_gcode:

# --------------------------------------------------------------------------
# Toolhead RGB (Nebula yellow)  --  RGB header (PB14).
# --------------------------------------------------------------------------
[neopixel toolhead_rgb]
pin: EBB:PB14
chain_count: 1
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.1
