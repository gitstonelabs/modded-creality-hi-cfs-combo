# ==========================================================================
# cfs.cfg  --  Creality Filament System over a CH340/CH341 USB-RS485 adapter
# --------------------------------------------------------------------------
# Driver: creality_cfs.py from github.com/gitstonelabs/creality-cfs-klipper
# The install script drops creality_cfs.py into ~/klipper/klippy/extras/.
# The module's cfs_macros.cfg is deliberately NOT installed; this repo's
# macros.cfg replaces it (see the note near the bottom of this file).
#
# Wiring (CH340/CH341 USB-RS485 dongle -> CFS 6-pin connector):
#   dongle A+  -> CFS pin 1 (RS485-A)
#   dongle B-  -> CFS pin 6 (RS485-B)
#   dongle GND -> CFS pin 5 (GND)
#   CFS pin 4 (+24V) <- printer 24V PSU ONLY (never the dongle)
# ==========================================================================

[creality_cfs]
serial_port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_XXXXXXXX-if00
#   CH340/CH341 stable path (1a86 = vendor id). Set yours: ls /dev/serial/by-id/
baud: 230400              # always 230400 for the CFS, non-negotiable
box_count: 1              # CFS CONTROLLERS (1-4), NOT slots. One 4-slot CFS = 1.
auto_init: True           # run CFS_INIT on klippy:ready
timeout: 0.1
retry_count: 3

filament_sensor: nebula_filament_sensor
#   The toolhead runout switch (defined in ebb42.cfg). Gates load/unload:
#   a load feeds until this trips, an unload completes when it clears.

extrude_temp: 220
#   Melt temp every load/unload/flush/cut heats to first (170C floor).
#   Override per-material with TEMP= from the slicer tool-change gcode.

# ---- Filament cutter: handled by CUT_FILAMENT (macros.cfg), NOT the module ----
# The module's CFS_CUT is a position ram confirmed by the box 0x05 state; it does
# NOT do the stock stallguard-calibrated ram + hall two-check. So we leave the
# module cut geometry UNSET (CFS_CUT stays disabled) and do the mechanical cut in
# the CUT_FILAMENT macro, which the custom T0-T3 tool-change gates the retract on.

# ---- Flush tuning (optional) ---------------------------------------------
#nozzle_volume: 183
#nozzle_clean_macro: WIPE_NOZZLE
#flush_cycle_cap: 80
#flush_default_len: 140
#flush_velocity: 360

# NOTE: we deliberately do NOT [include cfs_macros.cfg] from the module. The
# tool-change (T0-T3), CFS_PRINT_START/END, and CFS_INITIALIZE live in macros.cfg
# so the cut can use the stock stallguard+hall CUT_FILAMENT instead of the module's
# position-based CFS_CUT. The module's raw commands (CFS_INIT, CFS_STATUS,
# CFS_RETRUDE, CFS_EXTRUDE, CFS_FLUSH, CFS_SET_PRELOAD, CFS_VERSION) are still
# provided by creality_cfs.py and are called from macros.cfg.

# ---- Optional: CFS buffer-empty sensor -----------------------------------
# Tap CFS connector pin 2 (buffer switch) + pin 5 (GND) to a spare 3.3V GPIO:
#[filament_switch_sensor cfs_buffer]
#switch_pin: ^PG12            # any spare Octopus/EBB 3.3V GPIO
#pause_on_runout: false
#runout_gcode:
#    RESPOND MSG="CFS buffer empty"
