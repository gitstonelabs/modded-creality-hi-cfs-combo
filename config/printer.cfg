[include mainsail.cfg]
# ==========================================================================
# printer.cfg  --  Modded Creality Hi (F018) on MAINLINE Klipper
# --------------------------------------------------------------------------
# Mainboard : BTT Octopus V1.0 (STM32F446ZET6)   main MCU, USB
# Toolhead  : BTT EBB42 Gen2 (STM32G0B1) over CAN -> ebb42.cfg + nebula.cfg
# Probe     : BTT Eddy Duo (RP2040)              -> eddy.cfg
# CFS       : Creality Filament System over CH340 USB-RS485 -> cfs.cfg
# --------------------------------------------------------------------------
# This is a MAINLINE Klipper config. Every Creality-fork-only section from
# the stock Hi is intentionally gone: prtouch_v3, motor_control (FOC servos),
# box, z_align, io_remap, tmc_line_check, bl24c16f, timer_read, and the
# heater_bed temp_offset_flag / adc_temp_list / power_calibration_* keys.
# Stock geometry/limits are carried; stock TUNING (accel, currents, shaper)
# is re-tuned for the new hardware.
# ==========================================================================

[include ebb42.cfg]
[include nebula.cfg]
[include eddy.cfg]
#[include cfs.cfg]     # CFS not wired yet: its CH340 (1a86) by-id is absent, so [creality_cfs] aborts Klipper start. Re-enable once the RS485 dongle is attached and its by-id is set in cfs.cfg.
[include macros.cfg]
[include client_macros.cfg]

# ---- Main MCU: BTT Octopus V1.1 (STM32F446ZET6), USB-to-CAN BRIDGE -------
# Build Klipper: STM32F446, 32KiB bootloader, 12MHz crystal, USB (PA11/PA12),
# with "USB to CAN bus bridge (USBCAN)" enabled. After flashing + can0 up,
# get the bridge UUID:  ~/klipper/scripts/canbus_query.py can0
[mcu]
canbus_uuid: 0000000000000000   # Octopus = USB-to-CAN bridge; set from canbus_query.py can0
#serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_XXXXXXXXXXXXXXXX-if00   # plain-USB (non-bridge) fallback

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000           # lowered from stock 12000; modded mass skipped on short moves. Re-tune UP after input_shaper cal.
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 8.0

# --------------------------------------------------------------------------
# X axis  --  Octopus Driver0. Homes to the LEFT switch on the EBB42 toolhead.
# --------------------------------------------------------------------------
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: ^!EBB:PA2         # left / park-flush switch on the EBB42 (over CAN)
position_endstop: -19
position_min: -19
position_max: 285
homing_speed: 30
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.800            # set to ~0.7 x your X motor's rated current
sense_resistor: 0.110
stealthchop_threshold: 0
# X stallguard: used by CALIBRATE_CUT_POS to find the cutter stopper at the right
# of travel. Normal G28 X still homes to the LEFT switch (EBB:PA2); this diag is
# only for the cutter-position calibration ram. Install the Driver0 DIAG jumper.
diag_pin: PG6                 # X stallguard for cutter CALIBRATE_CUT_POS (needs the Driver0 DIAG jumper)
driver_SGTHRS: 90             # TUNE on the bench (higher = more sensitive)

# --------------------------------------------------------------------------
# Y axis  --  Octopus Driver1. Physical Y limit switch on the Driver1 STOP header.
# --------------------------------------------------------------------------
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG11            # Y limit switch (rewired to the PG11 STOP header)
position_endstop: -7
position_min: -7
position_max: 273
homing_speed: 100
homing_retract_dist: 10
second_homing_speed: 20

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.850            # set to ~0.7 x your Y motor's rated current
sense_resistor: 0.110
stealthchop_threshold: 0

# --------------------------------------------------------------------------
# Z / Z1  --  Octopus Driver2 / Driver3. Dual Z, probe-homed via Eddy.
# --------------------------------------------------------------------------
[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 32
rotation_distance: 8
endstop_pin: ^PG10             # Z-RIGHT optical switch at Z-MAX (Z-STOP header); homes UP. stepper_z = RIGHT screw (220,130), matches [z_tilt].
position_endstop: 307.2        # updated with paper test 307.3-.1
position_max: 310
position_min: -0.5            # tightened from -5: guards a bad auto-Z0 (trips out-of-range, not the bed)
homing_speed: 50              # gentle up-home into the Z switches (less over-travel)
second_homing_speed: 15
homing_retract_dist: 5.0
[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.510            # carried from stock Z
sense_resistor: 0.110
stealthchop_threshold: 999999

[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
microsteps: 32
rotation_distance: 8
endstop_pin: ^PG9             # Z-LEFT optical switch at Z-MAX; stepper_z1 = LEFT screw (40,130), matches [z_tilt]. Each Z motor homes to its own switch = squares the gantry.

[tmc2209 stepper_z1]
uart_pin: PC7
run_current: 0.510
sense_resistor: 0.110
stealthchop_threshold: 999999

# Dual-Z gantry leveling (replaces the stock optical [z_align]).
# G28 Z squares the gantry mechanically: each Z motor homes to its own Z-max
# optical switch. [z_tilt] (further below) is NOT called from G28; it exists
# for manual Eddy-based fine squaring via an explicit Z_TILT_ADJUST.
# The Eddy is the bed probe (mesh + auto print-Z0 + the manual z_tilt points).

# --------------------------------------------------------------------------
# Heated bed  --  MAINLINE clean.
# Stock Hi bed = AC-mains silicone pad switched by an opto-isolated SSR
# (BED-HEAT-AC-V2.5: T1635 triac + EL3063 zero-cross opto driver), plus a 100K NTC.
#
# DRIVER: an AO3401 P-channel HIGH-SIDE stage sits between the Octopus and the AC
# board. AC pin2 is the opto LED ANODE and needs ~15mA SOURCED into it; a low-side
# FET alone can never do that. Schematic, resistor values, and the bench proof are in
# hi-ac-bed-to-octopus-wiring.md (repo root). That doc is the source of truth; this
# comment does not restate it. Built and confirmed working 2026-07-15.
#   AC pin2 (LED anode)   <- PMOS drain via R2 = 270 ohm (MANDATORY: bare LED, the AC
#                            board has NO on-board current limit)
#   AC pin3 (LED CATHODE) -> its OWN dedicated ground wire. Grounding pin1 alone does
#                            NOT complete the LED loop. Do not low-side-switch pin3.
#   AC pin4               -> stiff Octopus +5V (also the PMOS source)
#   AC pin1               -> Octopus GND (common ground mandatory)
#   R1 = 10k gate pull-up (default OFF), R3 = 10k from pin2 to GND (off-state pull-down)
#   #13 pad NTC -> PF3/TB.  Leave BED+ (24V) UNCONNECTED.
# PA1 (the BED low-side FET) SINKS the PMOS gate; the PMOS sources 5V into pin2. The
# external PMOS re-inverts, so the net behaviour is ACTIVE-HIGH.
#
# SAFETY: heater_pin MUST be NON-inverted (no "!"). An inverted pin idles HIGH, and a
# HIGH idle arms the bed whenever Klipper is idle. Fail-safe by topology: Klipper heat
# off / MCU reset / power loss / firmware_restart -> PA1 releases -> R1 pulls the gate
# to 5V -> PMOS off -> pin2 = 0V -> LED dark -> triac off.
# NEVER put pin2 on a thermistor input (PF3/PF4/... carry a 4.7k pullup that arms the
# SSR before Klipper even runs = the boot-heat fault we hit).
#
# SUPERSEDED, pre-2026-07-15 revisions of this repo: the bed was driven DIRECTLY off
# PG13, a source-capable STOP-header GPIO, and this file carried a "NEVER use
# BED_OUT/PA1 or any FAN/HEx" warning. That warning was CORRECT for direct SSR drive,
# where the pin itself has to source the LED current. It does NOT apply once the PMOS
# high-side stage is fitted, because PA1 then only sinks a gate. If your hardware has
# no PMOS stage you are still on the old design: use PG13, not PA1.
#
# Mains AC NEVER reaches the Octopus. Before energizing, meter the triac (MT1-MT2 NOT
# shorted) and AC-to-control isolation (open). See docs/bring-up-checklist for the sweep.
# A triac fails SHORTED more often than open, and a shorted triac cannot be turned off
# by any heater_pin. verify_heater does NOT catch it. An independent, non-firmware
# thermal cutoff (bed thermal fuse / klixon in series with the AC load) is mandatory.
# --------------------------------------------------------------------------
[heater_bed]
heater_pin: PA1         # BED low-side FET sinks the AO3401 gate; the PMOS sources 5V into AC pin2.
                        # NO "!": the external PMOS re-inverts, so this is ACTIVE-HIGH. An inverted
                        # pin idles HIGH = bed armed whenever Klipper is idle.
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF3
control: pid
pid_kp: 20
pid_ki: 0.1
pid_kd: 0.06
min_temp: 0
max_temp: 115
max_power: 0.4          # COMMISSIONING duty cap: the first energized heat cannot slam full
                        # mains duty. Raise toward 1.0 only after the supervised low-duty
                        # heat passes (bring-up step 5), before PID_CALIBRATE.
# The stock temp_offset_flag / adc_temp_list / actual_temp_list / power_calibration_*
# keys are Creality-fork extensions and are INVALID in mainline Klipper.
#
# BED COMMISSIONING IS STILL OUTSTANDING. The driver stage is built and triggers on
# M140 S60 / stops on S0, but the bed is NOT finished. Remaining, in order:
# PID_CALIBRATE HEATER=heater_bed TARGET=60 after the first supervised heat, restore
# max_power toward 1.0, confirm fail-safe on reset (cut MCU power, pin2 must read 0V),
# then SAVE_VARIABLE VARIABLE=bed_commissioned VALUE=1. Full sequence: docs/bring-up-checklist
# section 5.

# Commissioning watchdog for the AC pad: tuned for a SLOW silicone pad at 40% duty
# (the extruder's 30s check_gain_time would false-trip here). Deliberately generous
# starting values; re-tighten after PID_CALIBRATE HEATER=heater_bed.
# NOTE: every bed-heat path is ALSO gated on save_variables bed_commissioned == 1
# (START_PRINT / _PREHEAT / HEAT_SOAK refuse until commissioning sets it).
[verify_heater heater_bed]
max_error: 240
check_gain_time: 120
hysteresis: 10
heating_gain: 1

# --------------------------------------------------------------------------
# Mainline plumbing for Moonraker / Mainsail / Fluidd
# --------------------------------------------------------------------------
[virtual_sdcard]
# Base section comes from mainsail.cfg (client.cfg). This later definition wins
# (Klipper parses config with strict=False: last value read is used), overriding
# mainsail's on_error_gcode: CANCEL_PRINT. A cut-abort (or any print gcode error)
# PAUSES for recovery via _ON_PRINT_ERROR (client_macros.cfg). Decided 2026-07-12.
path: ~/printer_data/gcodes
on_error_gcode: _ON_PRINT_ERROR

#[pause_resume]  # mainsail.cfg
#[display_status]  # mainsail.cfg
#[respond]  # mainsail.cfg

[save_variables]
filename: ~/printer_data/config/variables.cfg   # persists cut_x (CALIBRATE_CUT_POS) etc.

[exclude_object]
[force_move]
enable_force_move: True

[gcode_arcs]
resolution: 0.1

[firmware_retraction]
# Needed by the Hi Panel touchscreen Tune tab (SET_RETRACTION) and mainsail's
# use_fw_retract. Starting values for the direct-drive Nebula: tune live via
# SET_RETRACTION, then bake the tuned numbers back HERE (runtime values do not
# survive a restart, and SAVE_CONFIG is off-limits on this rig - key298).
retract_length: 0.5
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

[idle_timeout]
timeout: 3600

[temperature_sensor octopus_mcu]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

# --------------------------------------------------------------------------
# Second accelerometer  --  BIGTREETECH S2DW V1.0, MOUNTED ON THE BED.
# Only needed for Y-axis input shaping on this bedslinger. The EBB42's onboard
# LIS2DW (ebb42.cfg) does X; this bed-mounted S2DW does Y so both axes can be
# calibrated without physically moving one accel between passes.
#
# WIRING -- NOT to the Octopus SPI header.
# The S2DW is a SELF-CONTAINED USB accelerometer: it carries its own RP2040 MCU
# (running Klipper) and an internal LIS2DW12 sensor on an internal software-SPI
# bus (RP2040 gpio8/9/10/11). The module talks to the HOST over USB-C only.
# So the single cable that leaves the bed is the USB-C -> host cable. There is
# nothing wired to the Octopus for this sensor.
#   - Flash the S2DW's RP2040 with the RP2040/USB Klipper build.
#   - Find its path:  ls /dev/serial/by-id/  (look for ...rp2040_btt_acc...)
#     and set the serial: below.
#
# (FALLBACK, NOT USED HERE: a BARE LIS2DW/ADXL345 breakout would instead wire
#  to the Octopus SPI3 header J74 -- hardware spi3, CS=PA15, SCK=PB3, MISO=PB4,
#  MOSI=PB5, fed from 3V3. That path is only for a raw sensor with no onboard MCU.)
# --------------------------------------------------------------------------
[mcu btt_s2dw]
serial: /dev/serial/by-id/usb-Klipper_rp2040_XXXXXXXXXXXXXXXX-if00   # <-- set from ls /dev/serial/by-id/ (S2DW RP2040, USB)
restart_method: command

[lis2dw bed]
# Pins are on the S2DW's OWN RP2040 (reached over USB), NOT the Octopus.
cs_pin: btt_s2dw:gpio9
spi_software_sclk_pin: btt_s2dw:gpio10
spi_software_mosi_pin: btt_s2dw:gpio11
spi_software_miso_pin: btt_s2dw:gpio8
# Mount = board silkscreen +Y pointing along the printer +X (the clean-wiring
# rotation), so the board's X axis senses printer Y. Cross-checked proper-rotation
# map (the LETTERS are load-bearing; signs are cosmetic for input shaping):
#   printer X <- board Y, printer Y <- board X, printer Z <- board Z.
# VERIFY ON THE BENCH: ACCELEROMETER_QUERY CHIP=bed at rest should read ~+9800 on Z
# only; TEST_RESONANCES AXIS=Y should give a clean dominant peak. If AXIS=Y comes
# back flat and AXIS=X lights up instead, X/Y are swapped -- keep x in the middle slot.
axes_map: y, -x, z

# Optional electronics-bay fan (pick a spare Octopus FAN pin from
# OCTOPUS-V1.0-master generic-bigtreetech-octopus.cfg, e.g. FAN outputs):
#[controller_fan octopus_fan]
#pin: <octopus FAN pin>
#fan_speed: 1.0

# ============================================================
#  G28 override + manual z_tilt + auto print-Z0
#  G28 = home X,Y,Z(switch square) -> center -> park Z15 -> probe
#        center x2 -> set Z0 gcode offset (ABORTS if >1mm) -> Z15.
#  Z_TILT_ADJUST is NOT called from G28: manual-only fine squaring.
#  DECISION 2026-07-12: auto-Z0 KEPT. Rationale: the eddy map zero
#  was reconciled to the paper/switch zero (Z_OFFSET_APPLY_PROBE map
#  shift, paper-verified at applied Z0 same day), and [bed_mesh]
#  zero_reference_position normalizes the mesh at this same probe
#  spot, so per-print auto-Z0 + mesh compensation compose without
#  double-counting and track real bed/plate changes; the eddy's
#  ~0.09mm session drift cancels at the shared zero spot. To revert
#  to switch-only Z0: delete the SET_PRINT_Z0 line below.
# ============================================================
[z_tilt]
z_positions:
    220, 130          # stepper_z  = RIGHT screw (FORCE_MOVE confirmed)
    40, 130           # stepper_z1 = LEFT screw
points:
    40, 130
    220, 130
speed: 200
horizontal_move_z: 3
retries: 10
retry_tolerance: 0.02

[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% if home_all or 'X' in params %}
        G28 X
    {% endif %}
    {% if home_all or 'Y' in params %}
        G28 Y
    {% endif %}
    {% if home_all or 'Z' in params %}
        {% if 'x' not in printer.toolhead.homed_axes %}
            G28 X
        {% endif %}
        {% if 'y' not in printer.toolhead.homed_axes %}
            G28 Y
        {% endif %}
        G28 Z
        G90
        G1 X130 Y130 F9000
        G1 Z15 F1200              # park BEFORE probing so SET_PRINT_Z0 descends 13mm, not 305mm
        SET_GCODE_OFFSET Z=0
        SET_PRINT_Z0
        G1 Z15 F1200
    {% endif %}

[gcode_macro SET_PRINT_Z0]
# Probe center twice, fold the switch-vs-bed difference into a gcode Z offset.
# SPLIT MACRO: a gcode_macro renders its whole Jinja body BEFORE any emitted line
# runs, so reading printer.probe.last_z_result in THIS macro would see the value
# from before its own PROBE (0.0 on a fresh boot = silent no-op offset).
# The read + apply live in _APPLY_PRINT_Z0, which renders after the PROBE ran.
gcode:
    PROBE SAMPLES=2 SAMPLES_RESULT=median
    _APPLY_PRINT_Z0

[gcode_macro _APPLY_PRINT_Z0]
# Child of SET_PRINT_Z0: renders after the parent's PROBE, so last_z_result is fresh.
# RAIL: aborts the home if the probe returns >1mm (placeholder z_offset / wrong sign).
gcode:
    {% set z = printer.probe.last_z_result %}
    {% if z|abs > 1.0 %}
        { action_raise_error("SET_PRINT_Z0 ABORT: probe returned %.3f mm (>1mm). Eddy z_offset likely uncalibrated - offset NOT applied. Fix before printing." % z) }
    {% else %}
        SET_GCODE_OFFSET Z_ADJUST={ z }
        { action_respond_info("Print Z0 set: applied Z_ADJUST=%.4f mm (sub-mm OK). Paper-test at Z0 before first print." % z) }
    {% endif %}

# --------------------------------------------------------------------------
# SAVE_CONFIG: on a running machine, Klipper appends an auto-generated
# "#*# <---- SAVE_CONFIG ---->" block below this line holding PER-MACHINE
# calibration (the eddy frequency map, bed mesh, heater PIDs). Never
# hand-edit that block, never copy it between machines (each unit generates
# its own during bring-up), and never add config sections below it.
# --------------------------------------------------------------------------
