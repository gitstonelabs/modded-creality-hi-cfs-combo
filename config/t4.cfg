# ==========================================================================
# t4.cfg  --  External spool as tool T4 (5th filament channel)  -- STAGED
# --------------------------------------------------------------------------
# DO NOT [include] until the DXC + SFS are physically installed and wired.
# Design: gitstonelabs/handoffs/DESIGN_external-spool-t4.md
# UI contract: "Creality HI3 touchscreen overlay/HANDOFF_t4-external-autofeed.md"
# Hardware verify: reverse-engineering/agent-findings/ext-spool-t4-hw-verify.md
#
# Chain: spool -> DXC (K1C motor, Motor4) -> SFS V2.0 -> Y-splitter -> shared
# PTFE -> Nebula extruder -> cutter -> nozzle. The Y merges AFTER the CFS
# buffer; the segment Y->nozzle is the common path (one filament at a time).
# Park position (PRIMED) = between SFS and Y, BEHIND the merge.
#
# SFS V2.0 wiring (BTT manual): red=VCC (3.3-5 V, DIES above 5 V), black=GND,
# blue=presence switch, green=motion pulse (2.88 mm/pulse). Power from the
# DIAG7 or BLTouch header 5V+GND. Both signals NEED '^' (open-drain outputs).
# ==========================================================================

[extruder_stepper dxc]
extruder:                 # unsynced at boot; macros manage sync.
                          # SYNCED while T4 is the active tool (no buffer on this
                          # path, dual-drive replaces the CFS box self-feed).
                          # UNSYNCED whenever T4 is not active, or the DXC feeds
                          # parked filament toward the Y during CFS prints.
step_pin: PF9             # Motor4 (Octopus PDF p20, confirmed 2026-07-20)
dir_pin: PF10             # flip after bench direction check
enable_pin: !PG2
microsteps: 16
rotation_distance: 6.9    # STARTING POINT (K1C stock). DXC is 6.25:1 with no
                          # settled community value: measure-and-trim 100 mm (V5).
full_steps_per_rotation: 200

[tmc2209 extruder_stepper dxc]
uart_pin: PF2
run_current: 0.55         # Creality stock drives the K1C motor at 0.5-0.55 A RMS.
                          # Do NOT copy Creality's sense_resistor 0.150 here.

[filament_switch_sensor sfs_presence]
switch_pin: ^PB6          # BLTouch header; '^' required (open-drain, reads LOW
                          # with no filament). Verify polarity with QUERY_BUTTON (V7).
pause_on_runout: false    # macros decide; presence edges are NORMAL during prime/park
runout_gcode:
    _EXT_PRESENCE_CLEARED
insert_gcode:
    _EXT_INSERTED

[filament_motion_sensor sfs_motion]
switch_pin: ^PG15         # DIAG7 header; '^' required
extruder: extruder
detection_length: 3.0     # BTT-recommended start; raise in +1 mm steps if noisy
pause_on_runout: false
runout_gcode:
    _EXT_MOTION_STALL

# --------------------------------------------------------------------------
# MACROS: land with the hardware (bench session). Names are the UI contract
# from HANDOFF_t4-external-autofeed.md - the panel buttons send these verbatim:
#   T4                  tool change into the external feeder
#   EXT_LOAD_AUTO       melt guard -> DXC feed (path_mm - margin fast, then slow)
#                       -> Nebula sensor trip -> sync -> melt-zone feed + flush
#   EXT_UNLOAD_AUTO     cut (if printing) -> synced retract past Nebula sensor
#                       -> DXC solo retract until sfs_presence clears + park_len
#   EXT_CALIBRATE_PATH  guided measure of path_mm -> SAVE_VARIABLE ext_path_mm
#                       (save_variables ONLY - SAVE_CONFIG crashes klippy, key298)
# Plus handlers: _EXT_INSERTED (prime), _EXT_PRESENCE_CLEARED, _EXT_MOTION_STALL,
# _EXT_BOOT_RECONCILE (delayed_gcode on ready; never auto-feed on state mismatch).
# Status object for the panel: ext_feeder {state, fed_mm, path_mm, path_learned,
# dxc_filament, sfs_motion, sfs_present, fault} - fault keys ext901 (load stall)
# / ext902 (clear never seen) / ext903 (DXC runout), peers of key846/847.
# OPEN (V9): does the DXC carry its own presence microswitch (UI expects
# dxc_filament)? If yes it needs a pin - PB7 probe port is the free candidate.
# --------------------------------------------------------------------------