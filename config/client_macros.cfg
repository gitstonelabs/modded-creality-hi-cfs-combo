# ==========================================================================
# client_macros.cfg  --  non-CFS user macros for the modded Hi
# --------------------------------------------------------------------------
# Single-material load/unload, preheat helpers, purge/prime, RGB status,
# filament-sensor toggles, heat soak, and the Mainsail client hooks
# (_CLIENT_VARIABLE). CFS macros live in macros.cfg and are a separate
# project: nothing here touches them.
#
# BED GATE: the AC-mains bed is uncommissioned until the bring-up procedure
# (handoff Item 3) is complete. Every bed-heating path here (and START_PRINT)
# checks save_variables bed_commissioned == 1 and refuses bed heat until
# commissioning finishes:  SAVE_VARIABLE VARIABLE=bed_commissioned VALUE=1
# ==========================================================================

# ---- Mainsail client hooks ------------------------------------------------
# Subset of the _CLIENT_VARIABLE template from mainsail client.cfg.
# runout_sensor: RESUME refuses to run while the toolhead sensor sees no
# filament (prevents resuming a runout-pause with nothing loaded).
# The user_* hooks drive the toolhead RGB on pause/resume/cancel.
[gcode_macro _CLIENT_VARIABLE]
variable_runout_sensor    : "filament_switch_sensor nebula_filament_sensor"
variable_user_pause_macro : "_RGB_STATE STATE=paused"
variable_user_resume_macro: "_RGB_STATE STATE=printing"
variable_user_cancel_macro: "_RGB_STATE STATE=idle"
gcode:

# ---- Print error path -----------------------------------------------------
# [virtual_sdcard] on_error_gcode (printer.cfg override) points here, so any
# gcode error during a file print (e.g. a CUT_FILAMENT abort) PAUSES the job
# for recovery instead of cancelling it. Decision approved 2026-07-12.
[gcode_macro _ON_PRINT_ERROR]
description: Internal on_error_gcode target; pause the job and show error state
gcode:
    PAUSE
    _RGB_STATE STATE=error
    RESPOND TYPE=error MSG="Print error: job PAUSED for recovery. Fix the fault, then RESUME or CANCEL_PRINT."

# ---- RGB status -------------------------------------------------------------
# toolhead_rgb: 2x GRB neopixels on EBB:PB14 (ebb42.cfg). Boot color = idle cyan.
[gcode_macro _RGB_STATE]
description: Set toolhead RGB by state: STATE=idle|heating|printing|paused|error|complete
gcode:
    {% set s = params.STATE|default('idle')|lower %}
    {% if s == 'heating' %}
        SET_LED LED=toolhead_rgb RED=1.0 GREEN=0.3 BLUE=0.0 SYNC=0
    {% elif s == 'printing' %}
        SET_LED LED=toolhead_rgb RED=1.0 GREEN=1.0 BLUE=1.0 SYNC=0
    {% elif s == 'paused' %}
        SET_LED LED=toolhead_rgb RED=1.0 GREEN=0.8 BLUE=0.0 SYNC=0
    {% elif s == 'error' %}
        SET_LED LED=toolhead_rgb RED=1.0 GREEN=0.0 BLUE=0.0 SYNC=0
    {% elif s == 'complete' %}
        SET_LED LED=toolhead_rgb RED=0.0 GREEN=1.0 BLUE=0.0 SYNC=0
    {% else %}
        SET_LED LED=toolhead_rgb RED=0.0 GREEN=0.5 BLUE=0.5 SYNC=0
    {% endif %}

# ---- Slicer name aliases ----------------------------------------------------
[gcode_macro PRINT_START]
description: Alias for START_PRINT (slicer compatibility)
gcode:
    START_PRINT {rawparams}

[gcode_macro PRINT_END]
description: Alias for END_PRINT (slicer compatibility)
gcode:
    END_PRINT {rawparams}

# ---- Load / unload (single-material, Nebula direct drive) -------------------
# The CFS has its own load path (CFS_EXTRUDE/CFS_RETRUDE); these are for bare
# single-spool use. Feed lengths are Nebula-scale (short direct-drive path),
# well under max_extrude_only_distance 500.
[gcode_macro LOAD_FILAMENT]
description: Load filament: heats to TEMP (default 220) if cold, feeds + purges
gcode:
    {% set mintemp = printer.configfile.settings.extruder.min_extrude_temp %}
    {% set t = params.TEMP|default(220)|int %}
    {% if t < mintemp %}
        { action_raise_error("LOAD_FILAMENT: TEMP=%d is below min_extrude_temp (%d)" % (t, mintemp)) }
    {% endif %}
    {% set heat_to = [t, printer.extruder.target|int]|max %}
    {% if not printer.extruder.can_extrude %}
        RESPOND MSG="LOAD_FILAMENT: heating to {heat_to}C"
        M109 S{heat_to}
    {% endif %}
    SAVE_GCODE_STATE NAME=_load_fil
    M83
    G1 E30 F300                   # feed through the gears into the melt zone
    G1 E40 F150                   # slow purge out the nozzle
    RESTORE_GCODE_STATE NAME=_load_fil
    RESPOND MSG="LOAD_FILAMENT done: check for a clean purge color"

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament: heats to TEMP (default 220) if cold, tip-shapes, retracts clear of the sensor
gcode:
    {% set mintemp = printer.configfile.settings.extruder.min_extrude_temp %}
    {% set t = params.TEMP|default(220)|int %}
    {% if t < mintemp %}
        { action_raise_error("UNLOAD_FILAMENT: TEMP=%d is below min_extrude_temp (%d)" % (t, mintemp)) }
    {% endif %}
    {% set heat_to = [t, printer.extruder.target|int]|max %}
    {% if not printer.extruder.can_extrude %}
        RESPOND MSG="UNLOAD_FILAMENT: heating to {heat_to}C"
        M109 S{heat_to}
    {% endif %}
    SET_FILAMENT_SENSOR SENSOR=nebula_filament_sensor ENABLE=0   # our own retract must not trigger a runout PAUSE
    SAVE_GCODE_STATE NAME=_unload_fil
    M83
    G1 E8 F150                    # soften the tip
    G1 E-12 F1800                 # quick pull out of the melt zone (tip shaping)
    G1 E-68 F1200                 # clear the gears and the toolhead runout sensor
    RESTORE_GCODE_STATE NAME=_unload_fil
    SET_FILAMENT_SENSOR SENSOR=nebula_filament_sensor ENABLE=1
    RESPOND MSG="UNLOAD_FILAMENT done: 80mm retracted, filament clear of the toolhead"

# ---- Preheat helpers --------------------------------------------------------
[gcode_macro _PREHEAT]
description: Internal preheat with the bed commissioning gate
gcode:
    {% set e = params.EXTRUDER|int %}
    {% set b = params.BED|int %}
    {% set bed_ok = printer.save_variables.variables.bed_commissioned|default(0)|int %}
    _RGB_STATE STATE=heating
    M104 S{e}
    {% if bed_ok == 1 %}
        M140 S{b}
        RESPOND MSG="Preheat: extruder {e}C, bed {b}C"
    {% else %}
        RESPOND TYPE=error MSG="Preheat: extruder {e}C only. BED HEAT BLOCKED: bed not commissioned (handoff Item 3, then SAVE_VARIABLE VARIABLE=bed_commissioned VALUE=1)."
    {% endif %}

[gcode_macro PREHEAT_PLA]
description: Preheat for PLA (extruder 210, bed 60)
gcode:
    _PREHEAT EXTRUDER=210 BED=60

[gcode_macro PREHEAT_PETG]
description: Preheat for PETG (extruder 240, bed 80)
gcode:
    _PREHEAT EXTRUDER=240 BED=80

[gcode_macro PREHEAT_ABS]
description: Preheat for ABS (extruder 250, bed 100)
gcode:
    _PREHEAT EXTRUDER=250 BED=100

# ---- Purge / prime -----------------------------------------------------------
[gcode_macro PURGE]
description: Stationary purge at the current position: PURGE MM=<len> (default 25, max 100)
gcode:
    {% set mm = params.MM|default(25)|float %}
    {% if mm <= 0 or mm > 100 %}
        { action_raise_error("PURGE: MM=%.1f out of range (0..100)" % mm) }
    {% endif %}
    {% if not printer.extruder.can_extrude %}
        { action_raise_error("PURGE: extruder below min_extrude_temp; heat it first") }
    {% endif %}
    SAVE_GCODE_STATE NAME=_purge
    M83
    G1 E{mm} F150
    RESTORE_GCODE_STATE NAME=_purge

[gcode_macro PRIME_LINE]
description: Prime line at the bed front-left (shared by START_PRINT); needs homed XYZ + hot nozzle
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        { action_raise_error("PRIME_LINE: home first (G28)") }
    {% endif %}
    {% if not printer.extruder.can_extrude %}
        { action_raise_error("PRIME_LINE: extruder below min_extrude_temp; heat it first") }
    {% endif %}
    # Motion below is the exact prime block that used to live inline in START_PRINT.
    G90
    G1 Z5 F600
    G1 X5 Y5 F6000
    G1 Z0.3 F600
    G92 E0
    G1 X120 E15 F1200
    G92 E0

# ---- Heat soak (blocked until the bed is commissioned) -----------------------
[gcode_macro HEAT_SOAK]
description: Heat the bed and soak: HEAT_SOAK BED=60 MINUTES=10 (bed gate applies)
gcode:
    {% set b = params.BED|default(60)|int %}
    {% set minutes = params.MINUTES|default(10)|int %}
    {% set bed_ok = printer.save_variables.variables.bed_commissioned|default(0)|int %}
    {% if bed_ok != 1 %}
        { action_raise_error("HEAT_SOAK blocked: bed not commissioned (handoff Item 3, then SAVE_VARIABLE VARIABLE=bed_commissioned VALUE=1).") }
    {% endif %}
    _RGB_STATE STATE=heating
    M190 S{b}
    RESPOND MSG="HEAT_SOAK: bed at {b}C, soaking {minutes} min"
    {% for i in range(minutes) %}
        G4 P60000
        RESPOND MSG="HEAT_SOAK: {i+1}/{minutes} min"
    {% endfor %}
    _RGB_STATE STATE=idle
    RESPOND MSG="HEAT_SOAK done"

# ---- Filament sensor toggles --------------------------------------------------
[gcode_macro FILAMENT_SENSOR_ON]
description: Enable the toolhead runout sensor
gcode:
    SET_FILAMENT_SENSOR SENSOR=nebula_filament_sensor ENABLE=1
    RESPOND MSG="Runout sensor ENABLED"

[gcode_macro FILAMENT_SENSOR_OFF]
description: Disable the toolhead runout sensor (bare-nozzle tests, service work)
gcode:
    SET_FILAMENT_SENSOR SENSOR=nebula_filament_sensor ENABLE=0
    RESPOND MSG="Runout sensor DISABLED (re-enable with FILAMENT_SENSOR_ON)"
