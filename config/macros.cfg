# ==========================================================================
# macros.cfg  --  mainline print macros for the modded Hi
# --------------------------------------------------------------------------
# Clean mainline replacements for the stock Creality gcode_macro.cfg (which
# depended on the box / prtouch / motor_control fork modules).
# The CFS tool-change (T0-T3) and CFS_PRINT_START/END live here (not the
# module's cfs_macros.cfg) so the cut uses the stock stallguard+hall
# CUT_FILAMENT instead of the module's position-based CFS_CUT.
# ==========================================================================

[gcode_macro START_PRINT]
description: Slicer print-start: heat, home, level, mesh, prime, arm CFS
gcode:
    {% set BED = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER_TEMP|default(220)|float %}
    {% if printer.save_variables.variables.bed_commissioned|default(0)|int != 1 %}
        { action_raise_error("START_PRINT blocked: AC-mains bed is NOT commissioned (handoff Item 3). After commissioning: SAVE_VARIABLE VARIABLE=bed_commissioned VALUE=1") }
    {% endif %}
    RESPOND MSG="Start print: bed {BED}C / hotend {EXTRUDER}C"
    _RGB_STATE STATE=heating
    M140 S{BED}                       # begin bed heat
    M104 S150                         # soften nozzle (no ooze during homing/probe)
    G28                               # home; homing_override centers, sets print Z0, parks Z15
    M190 S{BED}                       # wait for bed
    BED_MESH_CALIBRATE METHOD=rapid_scan   # eddy continuous sweep (9x9 in ~1min); METHOD=automatic = discrete probing
    M109 S{EXTRUDER}                  # wait for hotend
    CFS_PRINT_START                   # arm CFS preloading (multi-color; no-op without CFS)
    PRIME_LINE                        # shared prime line (client_macros.cfg)
    _RGB_STATE STATE=printing
    RESPOND MSG="Printing"

[gcode_macro END_PRINT]
description: Slicer print-end: retract, park, cool, unload CFS tool
gcode:
    M400
    G91
    G1 E-3 F1800                      # small retract
    G1 Z10 F600                       # lift
    G90
    G1 X5 Y270 F6000                  # present the bed
    TURN_OFF_HEATERS
    M107
    CFS_PRINT_END                     # unload active tool + disarm preload
    M84
    _RGB_STATE STATE=complete
    RESPOND MSG="Print complete"

[gcode_macro M600]
description: Filament change (pause + park + retract)
gcode:
    {% set X = 5 %}
    {% set Y = 5 %}
    {% set Z = 10 %}
    PAUSE
    G91
    G1 E-2 F1800
    G1 Z{Z} F600
    G90
    G1 X{X} Y{Y} F6000
    RESPOND MSG="M600: change filament, then RESUME"

[gcode_macro WIPE_NOZZLE]
description: Wipe the nozzle over the left flush zone (off-bed, X < 0)
# Strokes across the off-bed flush zone at the LEFT (the park/flush switch side).
# X stays >= -15 (4mm clear of the -19 park switch); the cutter at the far RIGHT
# is never approached. wipe_z 8 is conservative air clearance: lower it toward
# the flush pad once the pad height is physically confirmed on this rig.
variable_wipe_x_a: -15
variable_wipe_x_b: -2
variable_wipe_y: 5
variable_wipe_z: 8
variable_passes: 4
gcode:
    {% set p = printer['gcode_macro WIPE_NOZZLE'] %}
    {% if 'z' not in printer.toolhead.homed_axes %}
        { action_raise_error("WIPE_NOZZLE: Z not homed; G28 first") }
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    G90
    {% if printer.toolhead.position.z < p.wipe_z %}
        G1 Z{p.wipe_z} F600               # clearance for the travel move
    {% endif %}
    G1 Y{p.wipe_y} F6000
    G1 X{p.wipe_x_b} F6000                # enter the flush zone
    G1 Z{p.wipe_z} F600                   # descend to wipe height only once off-bed
    {% for i in range(p.passes|int) %}
        G1 X{p.wipe_x_a} F6000
        G1 X{p.wipe_x_b} F6000
    {% endfor %}
    RESPOND MSG="WIPE_NOZZLE: {p.passes|int} passes at Z{p.wipe_z} over the left flush zone"

# ==========================================================================
# Filament cutter  --  stock-faithful stallguard-calibrated ram + hall two-check
# --------------------------------------------------------------------------
# WHY THE ODD STRUCTURE: a Klipper [gcode_macro] renders its WHOLE Jinja body to
# a flat gcode string ONCE, before any emitted line runs, and printer[...] status
# is a snapshot cached at macro entry. So a hall read written inline after a move
# would see the PRE-move value. Each hall read therefore lives in its own child
# macro (_CUT_REQUIRE_*), which renders fresh at its own run time -- i.e. AFTER the
# preceding move + M400 + settle dwell. A failed check raises action_raise_error,
# which aborts the entire tool-change stream (so CFS_RETRUDE never runs); the print
# then pauses via [virtual_sdcard] on_error_gcode -> _ON_PRINT_ERROR (printer.cfg
# overrides mainsail's CANCEL_PRINT default; no retract happened). Resume-after-jam
# recovery is a bench-validation item.
#
# BENCH-VALIDATE before trusting on a real print:
#   1. QUERY_BUTTON BUTTON=cutter_hall -> RELEASED at rest, PRESSED at the stopper.
#      If reversed, flip ^ / ^! on [gcode_button cutter_hall] (ebb42.cfg).
#   2. Tune [tmc2209 stepper_x] driver_SGTHRS, jog to the stopper, CALIBRATE_CUT_POS.
#   3. Dry-run CUT_FILAMENT with NO filament and watch the two-check messages.
#   Resume-after-jam mid-print recovery also needs bench validation.
# ==========================================================================

[gcode_macro CUT_FILAMENT]
description: Ram the cutter and verify via the hall two-check (per-phase). Sets cut_ok.
variable_pre_cut_x: 240
variable_pre_cut_y: 130
variable_retreat_x: 255           # X to back off to after the cut (clear of the stopper)
variable_ram_feed: 3000           # mm/min
variable_safe_z: 10
variable_cut_ok: 0
gcode:
    {% set p = printer['gcode_macro CUT_FILAMENT'] %}
    {% set cut_x = printer.save_variables.variables.cut_x|default(280.1)|float %}
    SET_GCODE_VARIABLE MACRO=CUT_FILAMENT VARIABLE=cut_ok VALUE=0
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    G90
    {% if 'z' in printer.toolhead.homed_axes and printer.toolhead.position.z < p.safe_z %}
        G1 Z{p.safe_z} F600
    {% endif %}
    _CUT_REQUIRE_CLEAR                       # hall must be RELEASED before the ram
    G1 X{p.pre_cut_x} Y{p.pre_cut_y} F9000
    G1 X{cut_x} F{p.ram_feed}                # ram the cutter lever
    M400
    G4 P200                                  # let the hall settle before the child reads it
    _CUT_REQUIRE_HIT                         # hall must be PRESSED (cut reached the stopper)
    G1 X{p.retreat_x} F{p.ram_feed}          # back off the stopper
    M400
    G4 P200
    _CUT_REQUIRE_CLEARED                     # hall must be RELEASED again; sets cut_ok=1

[gcode_macro _CUT_REQUIRE_CLEAR]
description: Internal: abort if the cutter hall is not RELEASED before the ram.
gcode:
    {% if printer['gcode_button cutter_hall'].state == 'PRESSED' %}
        { action_raise_error("CUT aborted: hall already TRIGGERED before the ram (cutter stuck?). Fix, then RESUME or CANCEL.") }
    {% endif %}

[gcode_macro _CUT_REQUIRE_HIT]
description: Internal: abort if the ram did not reach the stopper (hall not PRESSED).
gcode:
    {% if printer['gcode_button cutter_hall'].state != 'PRESSED' %}
        { action_raise_error("CUT aborted: hall never triggered -- cut NOT confirmed. NOT retracting (clog risk). Fix, then RESUME or CANCEL.") }
    {% endif %}

[gcode_macro _CUT_REQUIRE_CLEARED]
description: Internal: abort if the cutter stayed engaged after retreat (jam); else mark cut_ok.
gcode:
    {% if printer['gcode_button cutter_hall'].state == 'PRESSED' %}
        { action_raise_error("CUT aborted: hall STUCK triggered after retreat -- cutter jammed. NOT retracting. Fix, then RESUME or CANCEL.") }
    {% else %}
        SET_GCODE_VARIABLE MACRO=CUT_FILAMENT VARIABLE=cut_ok VALUE=1
        RESPOND MSG="CUT ok: hall triggered then cleared"
    {% endif %}

[gcode_macro CALIBRATE_CUT_POS]
description: Save the current X as the cutter ram target (cut_x), persisted across restarts.
# Jog X to just touching the cutter stopper (sensorless approach once driver_SGTHRS
# is tuned, or jog manually), then run this. CUT_FILAMENT reads cut_x from save_variables.
gcode:
    {% set x = printer.toolhead.position.x %}
    SAVE_VARIABLE VARIABLE=cut_x VALUE={x}
    RESPOND MSG="Cutter position saved: cut_x={x} (persists across restarts)."

# ==========================================================================
# CFS tool change  --  the mechanical cut gates the box retract
# --------------------------------------------------------------------------
# If use_cut=1 and the cut fails/jams, CUT_FILAMENT raises an error that aborts
# this whole macro BEFORE CFS_RETRUDE, so uncut filament is never pulled back.
# Set use_cut / use_flush to match your hardware.
# ==========================================================================

[gcode_macro _CFS_CHANGE]
description: Internal CFS tool change with cutter gating. Called by T0-T3.
variable_use_cut: 1
variable_use_flush: 0
variable_flush_volume: 0
gcode:
    {% set target = params.TOOL|int %}
    {% set prev = printer['creality_cfs'].active_tool if 'creality_cfs' in printer else -1 %}
    {% set use_cut = printer['gcode_macro _CFS_CHANGE'].use_cut|int %}
    {% set use_flush = printer['gcode_macro _CFS_CHANGE'].use_flush|int %}
    {% set vol = printer['gcode_macro _CFS_CHANGE'].flush_volume|int %}
    {% if prev == target %}
        RESPOND MSG="CFS: T{target} already active"
    {% elif prev < 0 %}
        RESPOND MSG="CFS: initial load T{target}"
        CFS_EXTRUDE TOOL={target}
    {% else %}
        RESPOND MSG="CFS: change T{prev} -> T{target}"
        {% if use_cut == 1 %}
            CUT_FILAMENT                 # raises + aborts the change if the cut fails/jams
        {% endif %}
        CFS_RETRUDE TOOL={prev}          # only reached when the cut confirmed (no error)
        CFS_EXTRUDE TOOL={target}
        {% if use_flush == 1 %}
            {% if vol > 0 %}
                CFS_FLUSH VOLUME={vol}
            {% else %}
                CFS_FLUSH
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro T0]
description: CFS slot A
gcode:
    _CFS_CHANGE TOOL=0

[gcode_macro T1]
description: CFS slot B
gcode:
    _CFS_CHANGE TOOL=1

[gcode_macro T2]
description: CFS slot C
gcode:
    _CFS_CHANGE TOOL=2

[gcode_macro T3]
description: CFS slot D
gcode:
    _CFS_CHANGE TOOL=3

# ---- CFS helpers (replace the module's cfs_macros.cfg wrappers) -----------
[gcode_macro CFS_INITIALIZE]
description: Discover/assign RS485 addresses for all CFS boxes
gcode:
    RESPOND MSG="CFS: auto-addressing..."
    CFS_INIT
    RESPOND MSG="CFS: init done (check console for online count)"

[gcode_macro CFS_PRINT_START]
description: Verify CFS online and arm pre-loading (called from START_PRINT)
gcode:
    {% if 'creality_cfs' in printer %}
        CFS_STATUS
        CFS_SET_PRELOAD BOX=1 MASK=15 ENABLE=1
        RESPOND MSG="CFS: armed for multi-color"
    {% else %}
        RESPOND MSG="CFS not present; skipping preload arm"
    {% endif %}

[gcode_macro CFS_PRINT_END]
description: Unload the active tool and disarm pre-loading (called from END_PRINT)
gcode:
    {% if 'creality_cfs' in printer %}
        {% set active = printer['creality_cfs'].active_tool %}
        {% if active >= 0 %}
            CFS_RETRUDE TOOL={active}
        {% endif %}
        CFS_SET_PRELOAD BOX=1 MASK=15 ENABLE=0
        RESPOND MSG="CFS: disarmed"
    {% else %}
        RESPOND MSG="CFS not present; nothing to disarm"
    {% endif %}

# ==========================================================================
# StoneLabs UI integration  --  CFS slot metadata via save_variables
# --------------------------------------------------------------------------
# The StoneLabs printer UI reads LIVE slot state (present / material / remaining /
# active) from the [creality_cfs] printer object, and stores the user-assigned
# names/colors in save_variables. CFS_SET_SLOT is what the UI's filament dialog
# calls to persist that metadata.
#
# Keys the UI reads (unit 1 = the CFS box; slot s = 1..4 maps to tools T0..T3):
#   cfs1_slot{s}_name      str   "" = empty
#   cfs1_slot{s}_material  str   PLA / PETG / ABS ...
#   cfs1_slot{s}_color     str   hex without # (e.g. 2bcdf2)
# These land in the SINGLE [save_variables] file (printer.cfg -> variables.cfg),
# alongside cut_x. Do NOT add a second [save_variables] section (Klipper allows one).
# ==========================================================================

[gcode_macro CFS_SET_SLOT]
description: Write slot metadata from the UI filament dialog (UNIT, SLOT, NAME, MATERIAL, COLOR)
gcode:
    {% set u = params.UNIT|default(1)|int %}
    {% set s = params.SLOT|default(1)|int %}
    # NAME/MATERIAL/COLOR arrive unquoted; re-wrap as quoted string literals so
    # save_variables stores them as strings.
    SAVE_VARIABLE VARIABLE=cfs{u}_slot{s}_name     VALUE='"{params.NAME|default("")}"'
    SAVE_VARIABLE VARIABLE=cfs{u}_slot{s}_material VALUE='"{params.MATERIAL|default("")}"'
    SAVE_VARIABLE VARIABLE=cfs{u}_slot{s}_color    VALUE='"{params.COLOR|default("")}"'
    RESPOND MSG="CFS: slot u{u}s{s} set to {params.NAME|default('')}"
