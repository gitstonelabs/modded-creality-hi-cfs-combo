# ==========================================================================
# nebula.cfg  --  BIQU Nebula extruder on the EBB42 Gen2
# --------------------------------------------------------------------------
# Extruder pins are the OFFICIAL EBB42 Gen2 motor header:
#   step=PD3  dir=PD2  enable=PB6  UART=PB3   heater=PB0   thermistor=PA1
# (The older-EBB42 PD1/PD0/PD2 + PB13 in the earlier WIP were WRONG for Gen2;
#  PD3 is the Gen2 STEP pin, so the old RGB=PD3 would have collided with it.)
#
# rotation_distance: 4.6 is the Nebula EFFECTIVE value (the 11.25:1 gearing is
# already baked in). Do NOT also add `gear_ratio: 11.25:1` -- that double-counts
# the reduction and drops the effective distance to ~0.4mm/rev (massive
# over-extrude). CALIBRATE it: heat, mark 120mm, extrude 100mm, measure what
# actually fed, then rotation_distance_new = 4.6 * (100 / actually_extruded).
# ==========================================================================

[extruder]
step_pin: EBB:PD3
dir_pin: EBB:PD2
enable_pin: !EBB:PB6
microsteps: 16
rotation_distance: 4.6            # Nebula effective (gear baked in). CALIBRATE. No gear_ratio.
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 500.0
max_extrude_cross_section: 50.0
heater_pin: EBB:PB0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBB:PA1
pullup_resistor: 2200
min_temp: 0
max_temp: 300
min_extrude_temp: 170
pressure_advance: 0.040
pressure_advance_smooth_time: 0.040
control: pid
pid_kp: 23.565                    # PLACEHOLDER: PID_CALIBRATE HEATER=extruder TARGET=220
pid_ki: 1.765
pid_kd: 78.646

[tmc2209 extruder]
uart_pin: EBB:PB3
run_current: 0.800                # BIQU Nebula spec; drop to 0.650 if the motor runs hot
sense_resistor: 0.110
interpolate: false
stealthchop_threshold: 0          # spreadCycle: better torque during retract/load

[verify_heater extruder]
max_error: 120
check_gain_time: 30
hysteresis: 5
heating_gain: 1
