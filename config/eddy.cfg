# ==========================================================================
# eddy.cfg  --  BTT Eddy Duo (RP2040) inductive coil probe
# --------------------------------------------------------------------------
# Replaces the stock prtouch_v3 strain-gauge probe. Provides Z homing
# (probe:z_virtual_endstop, set in printer.cfg [stepper_z]) and bed mesh.
#
# Bring-up: flash in USB mode first (USBSERIAL, GENERIC_03H, CLKDIV 4), verify,
# then optionally move it onto the CAN bus. Default below is the confirmed USB
# path; switch to canbus_uuid once flashed for CAN.
#
# First-boot calibration (do IN ORDER):
#   G28 X Y
#   G0 X130 Y130 F6000
#   (lower nozzle to ~2mm above bed with FORCE_MOVE or paper method)
#   LDC_CALIBRATE_DRIVE_CURRENT CHIP=btt_eddy
#   PROBE_EDDY_CURRENT_CALIBRATE CHIP=btt_eddy
#   SAVE_CONFIG
#   BED_MESH_CALIBRATE
#   TEMPERATURE_PROBE_CALIBRATE PROBE=btt_eddy_temp_probe    (optional)
# ==========================================================================

[mcu eddy]
canbus_uuid: 0000000000000000    # Eddy Duo on the CAN bus off the Octopus bridge; set from canbus_query.py can0
#serial: /dev/serial/by-id/usb-Klipper_rp2040_XXXXXXXXXXXXXXXX-if00   # USB (non-CAN) fallback

[temperature_sensor eddy_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
z_offset: 2.0                 # probe trigger height; tune manually (paper method / Z_OFFSET_APPLY_PROBE).
                              # PROBE_EDDY_CURRENT_CALIBRATE writes the separate frequency map (calibrate=...), NOT this.
x_offset: 4.45               # coil is 4.45mm RIGHT (+X) of the nozzle in the Klipper frame (verified; trust this number)
y_offset: -22.77             # coil is 22.77mm in FRONT (-Y) of the nozzle in the Klipper frame (verified; trust this number)
i2c_mcu: eddy
i2c_bus: i2c0f
speed: 5
lift_speed: 10
samples: 3
samples_result: median
sample_retract_dist: 3
samples_tolerance: 0.010
samples_tolerance_retries: 5

[temperature_probe btt_eddy_temp_probe]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
min_temp: 0
max_temp: 100

# [safe_z_home] REMOVED: Z homes UP to the optical switches now (dual-Z square), not down via the probe. Standard G28 applies.

# Bed mesh (defined here so the probe area accounts for y_offset).
[bed_mesh]
speed: 300
horizontal_move_z: 2         # scan height for METHOD=scan/rapid_scan (eddy is most accurate ~2mm and
                             # the height MUST sit inside the calibrate map range); also the probe-method
                             # travel height (bed relative range is ~0.6, so 2mm still clears)
mesh_min: 40, 40             # PROBE(coil) coords
mesh_max: 225, 225
probe_count: 9, 9            # dense grid; nearly free with rapid_scan (offset confirmed 2026-07-12)
zero_reference_position: 134.45, 107.23
                             # ^ the SET_PRINT_Z0 probe spot (nozzle 130,130 + coil offset 4.45,-22.77).
                             # Mesh normalizes to 0 here so per-print auto-Z0 (which re-zeros this exact
                             # spot) and mesh compensation never double-count the absolute bed height.
scan_overshoot: 5            # extra X travel past the mesh edge so rapid_scan rows hold constant velocity
fade_start: 1.0
fade_end: 10.0
algorithm: bicubic
split_delta_z: 0.01
move_check_distance: 3
